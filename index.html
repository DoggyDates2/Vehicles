<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoggyDates Vehicles</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1d21; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f8fa; --card:#fff;
    --inuse:#8b8f96; --avail:#22a06b; --shop:#f08c00; --dead:#d63939; --attn:#e03131;
    --accent:#1b1d21; --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
  #map{position:absolute;inset:0}
  .leaflet-container{font:inherit}

  /* top bar */
  #top{position:absolute;top:12px;left:12px;right:12px;z-index:900;display:flex;gap:10px;align-items:center;pointer-events:none}
  #top>*{pointer-events:auto}
  .brand{background:var(--accent);color:#fff;font-weight:700;padding:10px 14px;border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.15)}
  #search{flex:0 1 320px;padding:10px 14px;border:0;border-radius:var(--r);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font:inherit;outline:none}
  #search:focus{box-shadow:0 0 0 3px rgba(27,29,33,.15)}
  #filters{display:flex;gap:6px;background:#fff;padding:6px;border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;cursor:pointer;user-select:none;font-weight:500;font-size:13px}
  .chip:hover{background:var(--bg)}
  .chip.off{opacity:.4}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
  .chip b{font-weight:600;color:var(--muted);margin-left:2px}
  #attnbtn{margin-left:auto;background:#fff;border:0;border-radius:var(--r);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;gap:8px;align-items:center}
  #attnbtn .n{background:var(--attn);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
  #attnbtn .n.zero{background:var(--line);color:var(--muted)}

  /* pins */
  .lot-box{background:rgba(255,255,255,.85);border:1.5px solid #cfd4db;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .lot-pin{display:inline-block;color:#374151;font-weight:600;font-size:12px;padding:0;white-space:nowrap}
  .leader{stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:3 3}
  .lot-pin b{color:var(--muted);font-weight:600;margin-left:6px}
  .car-pin{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 8px 0 0;white-space:nowrap;background:#fff;border-radius:7px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:11.5px;cursor:grab;overflow:hidden;border:1.5px solid #fff}
  .car-pin .bar{width:5px;align-self:stretch;background:var(--c);flex:none}
  .car-pin .drv{font-weight:700;flex:none}
  .car-pin .drv.spare{color:var(--muted);font-weight:500;font-style:italic}
  .car-pin .tag{max-width:160px;overflow:hidden;text-overflow:ellipsis;color:#374151}
  .car-pin .tag:empty{display:none}
  .car-pin .seats{flex:none;font-weight:700;background:var(--bg);border-radius:6px;padding:1px 5px;font-size:10.5px;color:#374151}
  .car-pin .ico{flex:none;font-size:11px;line-height:1}
  .car-pin.attn{border-color:var(--attn)}
  .car-pin:hover{box-shadow:0 3px 10px rgba(0,0,0,.3)}

  /* side panel */
  #panel{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--card);box-shadow:-6px 0 24px rgba(0,0,0,.12);z-index:950;transform:translateX(105%);transition:transform .18s ease}
  #panel.open{transform:none}
  #pbody{height:100%;display:flex;flex-direction:column}
  .ph{position:relative;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .ph .close{position:absolute;top:12px;right:12px;border:0;background:var(--bg);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
  .ph h2{margin:0;font-size:20px;font-weight:700;line-height:1.2;padding-right:36px}
  .ph .sub{color:var(--muted);margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 20px 4px}
  .btn{border:0;border-radius:10px;padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;background:var(--bg);color:var(--ink)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.warn{background:#fff4e0;color:#8a5a00}
  .btn:hover{filter:brightness(.96)}
  .pb{overflow:auto;flex:1;padding:6px 20px 24px}
  .sec{margin-top:16px}
  .sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .f{margin-bottom:10px}
  .f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:#9ca3af;box-shadow:0 0 0 3px rgba(27,29,33,.08)}
  .f textarea{min-height:60px;resize:vertical}
  .f textarea.status{border-color:#f5b5b5;background:#fff8f8}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g2 .f{margin-bottom:0}
  .note{color:var(--muted);font-size:12px}
  .oilline{display:flex;align-items:center;justify-content:space-between;background:#fff8e6;border-radius:9px;padding:9px 12px;margin-bottom:10px;font-weight:500;font-size:13px}
  .oilline.ok{background:var(--bg);color:var(--muted);font-weight:400}
  .hist{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
  .hist div{position:relative;padding:3px 0 9px;font-size:13px}
  .hist div::before{content:'';position:absolute;left:-17px;top:9px;width:8px;height:8px;border-radius:50%;background:#cbd5e1}
  .hist .d{color:var(--muted);font-size:11.5px;display:block}
  .addnote{display:flex;gap:8px}
  .addnote input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit}
  .savebar{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 30%);padding:14px 0 0;margin-top:8px}
  .savebar .btn{width:100%}

  /* attention list */
  .alist h3{margin:14px 0 6px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  .alist h3 .n{color:var(--muted);font-weight:500}
  .arow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
  .arow:hover{background:var(--bg)}
  .arow i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .arow .t{flex:1;min-width:0}
  .arow .t b{display:block;font-weight:600}
  .arow .t span{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arow .r{color:var(--muted);font-size:12px;flex:none}

  #zoomhint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:900;display:none}
  #toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 16px;border-radius:999px;display:none;z-index:1000;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  @media (max-width:760px){
    #top{flex-wrap:wrap}
    #search{flex-basis:100%}
    #filters{flex-wrap:wrap}
    #panel{width:100%}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="brand">Vehicles</div>
  <input id="search" placeholder="Search driver, name, code, plate">
  <div id="filters"></div>
  <button id="attnbtn">Attention <span class="n zero" id="attnCount">0</span></button>
</div>

<div id="panel"><div id="pbody"></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyTaQa0lB9Dmtg2NM0hJ3J8cOXHS2mYp57yeDbOPgojf4CfoZtCQ9oclNVL7x34RxQw/exec';
const OIL_DAYS = 50, OIL_WARN = 3;
const SHOW_CARS_ZOOM = 0;    // cars show at every zoom (raise to 13 to hide them when zoomed out)
const COL_MAX = 6;           // cars per column under a lot

const CATS = {
  'In use':          'var(--inuse)',
  'Available':       'var(--avail)',
  'In shop, usable': 'var(--shop)',
  'Not usable':      'var(--dead)'
};
const MANUAL = ['Available', 'In shop, usable', 'Not usable'];

let data = { cars: [], lots: [], drivers: [] };
let markers = [], lotMarkers = [], selected = null, swapFrom = null, panelMode = null;
let hidden = new Set(); try { hidden = new Set(JSON.parse(localStorage.getItem('vehHidden') || '[]')); } catch(e) {}

const map = L.map('map', { zoomControl: false }).setView([42.25, -71.3], 11);
L.control.zoom({ position: 'bottomleft' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19, opacity: 0.35 }).addTo(map);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function plateOf(code){ const c = String(code || '').replace(/[^A-Za-z0-9]+$/, '').trim(); const m = c.match(/([A-Z]?\d[A-Z0-9]*)$/); return (m ? m[1] : c).toUpperCase(); }
function shortLot(a){ return String(a || '').split(',')[0]; }
function driverOf(plate){ const c = data.cars.find(x => x.Plate === plate); return c ? (c.Driver || '') : ''; }
function codeOf(car){ return car.Code; }
function catOf(c){ if (c.Condition && c.Condition !== 'Available') return c.Condition; return driverOf(c.Plate) ? 'In use' : 'Available'; }
function colorOf(c){ return CATS[catOf(c)]; }
function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
function workDaysBetween(a, b){ let d = new Date(a), n = 0; d.setHours(0,0,0,0); b = new Date(b); b.setHours(0,0,0,0); while (d < b){ d.setDate(d.getDate()+1); if (d.getDay() % 6) n++; } return n; }
function oilDaysLeft(c){ if (!c.OilChangedOn) return null; const t = new Date(c.OilChangedOn); if (isNaN(t)) return null; return (Number(c.OilIntervalDays) || OIL_DAYS) - workDaysBetween(t, new Date()); }
function oilText(c){ const d = oilDaysLeft(c); if (d === null) return c.OilDue === 'Y' ? 'Flagged for oil change' : ''; return d < 0 ? `Oil overdue by ${plural(-d,'day')}` : d === 0 ? 'Oil change due today' : `Oil change due in ${plural(d,'day')}`; }
function oilShort(c){ const d = oilDaysLeft(c); if (d === null) return 'flagged'; return d < 0 ? `overdue ${plural(-d,'day')}` : d === 0 ? 'due today' : `in ${plural(d,'day')}`; }
function oilDue(c){ const d = oilDaysLeft(c); return c.OilDue === 'Y' || (d !== null && d <= OIL_WARN); }
function toast(t){ const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2200); }

async function load(){ const r = await fetch(WEBAPP_URL); data = await r.json(); render(); }
async function post(body){
  toast('Saving…');
  const r = await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) { toast('Error: ' + j.error); throw new Error(j.error); }
  data = j; render(); toast('Saved'); return j;
}

/* ---------- filters ---------- */
function renderFilters(){
  const counts = {}; data.cars.forEach(c => { const k = catOf(c); counts[k] = (counts[k] || 0) + 1; });
  $('filters').innerHTML = Object.entries(CATS).map(([k,v]) => `<div class="chip ${hidden.has(k) ? 'off' : ''}" data-cat="${k}" style="--c:${v}"><i></i>${k}<b>${counts[k] || 0}</b></div>`).join('');
  $('filters').querySelectorAll('.chip').forEach(el => el.onclick = () => {
    const k = el.dataset.cat; hidden.has(k) ? hidden.delete(k) : hidden.add(k);
    localStorage.setItem('vehHidden', JSON.stringify([...hidden])); render();
  });
}

/* ---------- map ---------- */
function render(){
  markers.forEach(m => map.removeLayer(m)); lotMarkers.forEach(m => map.removeLayer(m)); markers = []; lotMarkers = [];
  renderFilters();
  const byLot = {}; data.cars.forEach(c => { (byLot[c.Lot] = byLot[c.Lot] || []).push(c); });
  const showCars = map.getZoom() >= SHOW_CARS_ZOOM;
  const STRIP_W = 150, ROW_H = 27, HEAD = 30;
  // one block per lot: size by how many strips it will show
  const blocks = data.lots.filter(l => l.lat).map(lot => {
    const cars = (byLot[lot.address] || []).filter(c => !hidden.has(catOf(c)));
    const cols = showCars ? Math.max(1, Math.ceil(cars.length / COL_MAX)) : 1, rows = showCars ? Math.min(cars.length, COL_MAX) : 0;
    const p = map.latLngToLayerPoint([lot.lat, lot.lng]);
    return { lot, cars, cols, rows, w: Math.max(150, cols * (STRIP_W + 8)) + 16, h: HEAD + rows * ROW_H + 14, x: p.x, y: p.y, ox: p.x, oy: p.y };
  });
  // push overlapping blocks apart (simple relaxation)
  for (let it = 0; it < 60; it++){
    let moved = false;
    for (let i = 0; i < blocks.length; i++) for (let j = i + 1; j < blocks.length; j++){
      const a = blocks[i], b = blocks[j];
      const dx = (a.x + a.w/2) - (b.x + b.w/2), dy = (a.y + a.h/2) - (b.y + b.h/2);
      const ox = (a.w + b.w)/2 + 12 - Math.abs(dx), oy = (a.h + b.h)/2 + 12 - Math.abs(dy);
      if (ox > 0 && oy > 0){
        moved = true;
        if (ox < oy){ const s = (dx >= 0 ? 1 : -1) * ox / 2; a.x += s; b.x -= s; }
        else { const s = (dy >= 0 ? 1 : -1) * oy / 2; a.y += s; b.y -= s; }
      }
    }
    if (!moved) break;
  }
  const sz = map.getSize(), tl = map.containerPointToLayerPoint([0, 0]);
  blocks.forEach(bk => { bk.x = Math.min(Math.max(bk.x, tl.x + 10), tl.x + sz.x - bk.w - 10); bk.y = Math.min(Math.max(bk.y, tl.y + 100), tl.y + sz.y - bk.h - 10); });
  blocks.forEach(bk => {
    const { lot, cars } = bk;
    const ll = map.layerPointToLatLng([bk.x, bk.y]);
    const shifted = Math.hypot(bk.x - bk.ox, bk.y - bk.oy) > 14;
    if (shifted) lotMarkers.push(L.polyline([[lot.lat, lot.lng], ll], { className: 'leader', interactive: false }).addTo(map));
    lotMarkers.push(L.marker(ll, { icon: L.divIcon({ className: '', html: `<div class="lot-box" style="width:${bk.w}px;height:${bk.h}px"></div>`, iconAnchor: [10, 24], iconSize: null }), interactive: false, zIndexOffset: 50 }).addTo(map));
    lotMarkers.push(L.marker(ll, { icon: L.divIcon({ className: '', html: `<div class="lot-pin">${esc(shortLot(lot.address))}<b>${cars.length}</b></div>`, iconAnchor: [0, 12], iconSize: null }), interactive: false, zIndexOffset: 500 }).addTo(map));
    if (!showCars) return;
    cars.forEach((c, i) => {
      const col = Math.floor(i / COL_MAX), rowi = i % COL_MAX;
      const drv = driverOf(c.Plate);
      const html = `<div class="car-pin ${c.Status ? 'attn' : ''}" style="--c:${colorOf(c)}">
          <span class="bar"></span>
          <span class="drv ${drv ? '' : 'spare'}">${esc(drv || 'unassigned')}</span>
          <span class="tag">${esc(c.Name || '')}</span>
          ${oilDue(c) ? '<span class="ico" title="Oil change due">&#128738;</span>' : ''}
        </div>`;
      const m = L.marker(ll, { draggable: true, icon: L.divIcon({ className: '', html, iconSize: null, iconAnchor: [-col*(STRIP_W + 8), -16 - rowi*ROW_H] }), zIndexOffset: 100 }).addTo(map);
      m.car = c;
      m.bindTooltip(`<b>${esc(codeOf(c))}</b><br>Plate ${esc(c.Plate)}${c.Year ? '<br>' + esc([c.Year, c.Make, c.Model].filter(Boolean).join(' ')) : ''}`, { direction: 'left', offset: [-6, -4 - rowi*ROW_H] });
      m.on('click', () => swapFrom ? doSwap(c.Plate) : openCard(c.Plate));
      m.on('dragend', async e => {
        const p = e.target.getLatLng(); let best = null, bestD = 1e9;
        blocks.forEach(b2 => { const d = map.distance(p, map.layerPointToLatLng([b2.x + b2.w/2, b2.y + b2.h/2])); if (d < bestD) { bestD = d; best = b2.lot; } });
        if (best && best.address !== c.Lot) { try { await post({ action: 'setLot', plate: c.Plate, lot: best.address }); } catch(err) { render(); } }
        else render();
      });
      markers.push(m);
    });
  });
  if (!render.fitted && data.lots.some(l => l.lat)) { render.fitted = true; map.fitBounds(data.lots.filter(l => l.lat).map(l => [l.lat, l.lng]), { padding: [60, 60] }); render(); return; }
  const mappedLots = new Set(data.lots.filter(l => l.lat).map(l => l.address));
  const attn = data.cars.filter(c => c.Status || oilDue(c) || catOf(c) === 'Not usable' || catOf(c) === 'In shop, usable' || !mappedLots.has(c.Lot)).length;
  $('attnCount').textContent = attn; $('attnCount').classList.toggle('zero', !attn);
  render.lastShow = map.getZoom() >= SHOW_CARS_ZOOM;
  if (panelMode === 'car' && selected) openCard(selected, true);
  if (panelMode === 'attn') openAttention();
}

/* ---------- attention panel ---------- */
function openAttention(){
  panelMode = 'attn'; $('panel').classList.add('open');
  const row = (c, right) => `<div class="arow" data-plate="${c.Plate}" style="--c:${colorOf(c)}"><i></i><div class="t"><b>${esc(c.Name || codeOf(c))} · ${esc(driverOf(c.Plate) || 'Unassigned')}</b><span>${esc(shortLot(c.Lot))}${c.Status ? ' · ' + esc(c.Status.split('\n')[0]) : ''}</span></div><div class="r">${right}</div></div>`;
  const oil = data.cars.filter(oilDue).sort((a,b) => (oilDaysLeft(a) == null ? 99 : oilDaysLeft(a)) - (oilDaysLeft(b) == null ? 99 : oilDaysLeft(b)));
  const stat = data.cars.filter(c => c.Status);
  const shop = data.cars.filter(c => catOf(c) === 'In shop, usable' || catOf(c) === 'Not usable');
  const mapped = new Set(data.lots.filter(l => l.lat).map(l => l.address));
  const offmap = data.cars.filter(c => !mapped.has(c.Lot));
  const sec = (title, list, right) => `<h3>${title} <span class="n">${list.length}</span></h3>` + (list.length ? list.map(c => row(c, right(c))).join('') : '<div class="note" style="padding:4px 10px">Nothing here</div>');
  $('pbody').innerHTML = `
    <div class="ph"><button class="close" id="closep">×</button><h2>Needs attention</h2><div class="sub">Click a car to open it</div></div>
    <div class="pb alist">
      ${sec('Oil change', oil, oilShort)}
      ${sec('Reported issues', stat, () => '')}
      ${sec('Out of service / in shop', shop, catOf)}
      ${sec('Not on the map', offmap, c => c.Lot || 'no lot')}
    </div>`;
  $('closep').onclick = closePanel;
  $('pbody').querySelectorAll('[data-plate]').forEach(d => d.onclick = () => openCard(d.dataset.plate));
}
function closePanel(){ $('panel').classList.remove('open'); panelMode = null; selected = null; }

/* ---------- car card ---------- */
async function doSwap(plateB){
  const plateA = swapFrom; swapFrom = null; document.body.style.cursor = '';
  if (plateA === plateB) { toast('Swap cancelled'); return; }
  const dA = driverOf(plateA), dB = driverOf(plateB);
  if (!dA && !dB) { toast('Both cars are spare, nothing to swap'); return; }
  if (dA) await post({ action: 'setDriver', plate: plateB, driver: dA });
  else await post({ action: 'setDriver', plate: plateA, driver: dB });
  openCard(plateB, true);
}

function openCard(plate, keep){
  const c = data.cars.find(x => x.Plate === plate); if (!c) return;
  selected = plate; panelMode = 'car'; $('panel').classList.add('open');
  const drv = driverOf(plate), cat = catOf(c);
  const drivers = data.drivers || [];
  const f = k => esc(c[k]);
  const hist = (c.History || '').split('\n').filter(Boolean).map(l => { const m = l.match(/^(\d{1,2}\/\d{1,2}\/\d{2,4}):\s*(.*)$/); return m ? `<div><span class="d">${esc(m[1])}</span>${esc(m[2])}</div>` : `<div>${esc(l)}</div>`; }).join('');
  const ot = oilText(c);
  const condOpts = (drv ? [`<option value="Available" ${cat === 'In use' ? 'selected' : ''}>In use</option>`] : [])
    .concat(MANUAL.filter(k => !(drv && k === 'Available')).map(k => `<option ${k === c.Condition ? 'selected' : ''}>${k}</option>`)).join('');

  $('pbody').innerHTML = `
  <div class="ph">
    <button class="close" id="closep">×</button>
    <h2>${esc(c.Name || '')}</h2>
    <div class="sub">${esc(drv || 'Unassigned')} · ${esc(codeOf(c))} · ${esc([c.Year, c.Make, c.Model].filter(Boolean).join(' '))}</div>
    <div class="chips">
      <span class="pill" style="--c:${colorOf(c)}"><i></i>${esc(cat)}</span>
      <span class="pill">${esc(shortLot(c.Lot))}</span>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="swap">Swap with another car</button>
    ${oilDue(c) ? '<button class="btn warn" id="oildone">Oil changed</button>' : '<button class="btn" id="oilflag">Flag for oil</button>'}
  </div>
  <div class="pb">
    <div class="oilline ${oilDue(c) ? '' : 'ok'}"><span>${ot || 'No oil change date on file'}</span><span>${c.OilChangedOn ? 'changed ' + esc(c.OilChangedOn) : ''}</span></div>

    <div class="sec"><h4>Assignment</h4>
      <div class="g2">
        <div class="f"><label>Driver</label><select id="f_driver"><option value="">Unassigned</option>${drivers.map(d => `<option ${d === drv ? 'selected' : ''}>${esc(d)}</option>`).join('')}<option value="__other">Someone else…</option></select><input id="f_newdrv" placeholder="Type the driver's name" style="display:none;margin-top:6px"></div>
        <div class="f"><label>Condition</label><select id="f_Condition">${condOpts}</select></div>
      </div>
      <div class="f" style="margin-top:10px"><label>Parked at</label>
        <select id="f_lot">${data.lots.map(l => `<option ${l.address === c.Lot ? 'selected' : ''}>${esc(l.address)}</option>`).join('')}<option value="__new">Type a new address…</option></select>
        <input id="f_newlot" placeholder="e.g. 168 Linden St, Wellesley, MA" style="display:none;margin-top:6px">
      </div>
    </div>

    <div class="sec"><h4>Right now</h4>
      <div class="f"><label>Name on the map (yours to change, e.g. White12-Hornissue)</label><input id="f_Name" value="${f('Name')}"></div>
      <div class="f"><label>Needs attention / status</label><textarea id="f_Status" class="status">${f('Status')}</textarea></div>
    </div>

    <div class="sec"><h4>Car details</h4>
      <div class="f"><label>Quirks</label><textarea id="f_Quirks">${f('Quirks')}</textarea></div>
      <div class="g2">
        <div class="f"><label>Seats</label><input id="f_Seats" value="${f('Seats')}"></div>
        <div class="f"><label>Keys</label><input id="f_Keys" value="${f('Keys')}"></div>
      </div>
      <div class="g2" style="margin-top:10px">
        <div class="f"><label>Inspection due</label><input id="f_InspectionDue" value="${f('InspectionDue')}"></div>
        <div class="f"><label>Oil interval (work days)</label><input id="f_OilIntervalDays" value="${f('OilIntervalDays') || OIL_DAYS}"></div>
      </div>
      <div class="f" style="margin-top:10px"><label>Oil changed on</label><input id="f_OilChangedOn" value="${f('OilChangedOn')}" placeholder="M/D/YYYY"></div>
      <div class="f"><label>Exterior damage</label><textarea id="f_Exterior">${f('Exterior')}</textarea></div>
      <div class="f"><label>Stickers</label><textarea id="f_Stickers">${f('Stickers')}</textarea></div>
    </div>

    <div class="sec"><h4>History</h4>
      <div class="addnote"><input id="f_note" placeholder="Add a note…"><button class="btn" id="addnote">Add</button></div>
      <div class="hist" style="margin-top:12px">${hist || '<div class="note">No history yet</div>'}</div>
    </div>

    <div class="savebar"><button class="btn primary" id="save">Save changes</button></div>
  </div>`;

  if (!keep && c.Lot) { const l = data.lots.find(x => x.address === c.Lot); if (l && l.lat) map.panTo([l.lat, l.lng]); }

  $('closep').onclick = closePanel;
  $('f_driver').onchange = e => { $('f_newdrv').style.display = e.target.value === '__other' ? 'block' : 'none'; };
  $('f_lot').onchange = e => { $('f_newlot').style.display = e.target.value === '__new' ? 'block' : 'none'; };
  $('swap').onclick = () => { swapFrom = plate; document.body.style.cursor = 'crosshair'; toast('Now click the car to swap with'); };
  const od = $('oildone'); if (od) od.onclick = () => post({ action: 'oilDone', plate });
  const of = $('oilflag'); if (of) of.onclick = () => post({ action: 'oilFlag', plate });
  $('addnote').onclick = async () => { const t = $('f_note').value.trim(); if (!t) return; await post({ action: 'addLog', plate, text: t }); };
  $('f_note').onkeydown = e => { if (e.key === 'Enter') $('addnote').click(); };
  $('save').onclick = async () => {
    const fields = {}; ['Name','Seats','Condition','Status','Quirks','Keys','InspectionDue','OilChangedOn','OilIntervalDays','Exterior','Stickers'].forEach(k => fields[k] = $('f_' + k).value);
    let newDrv = $('f_driver').value; if (newDrv === '__other') newDrv = $('f_newdrv').value.trim();
    const newLot = $('f_lot').value;
    await post({ action: 'saveCar', plate, fields });
    if (newLot === '__new') { const a = $('f_newlot').value.trim(); if (a) await post({ action: 'addLot', plate, lot: a }); }
    else if (newLot !== c.Lot) await post({ action: 'setLot', plate, lot: newLot });
    if (newDrv !== drv) await post({ action: 'setDriver', plate, driver: newDrv });
  };
}

/* ---------- search / keys ---------- */
$('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let first = null;
  markers.forEach(m => {
    const c = m.car, hit = !q || codeOf(c).toLowerCase().includes(q) || c.Plate.toLowerCase().includes(q) || driverOf(c.Plate).toLowerCase().includes(q) || (c.Name || '').toLowerCase().includes(q);
    m.getElement().style.opacity = hit ? 1 : 0.12;
    if (hit && !first) first = m;
  });
  if (q && first) map.panTo(first.getLatLng());
});
$('attnbtn').onclick = () => panelMode === 'attn' ? closePanel() : openAttention();
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (swapFrom) { swapFrom = null; document.body.style.cursor = ''; toast('Swap cancelled'); } else closePanel(); } });

map.on('zoomend moveend', () => render());
load().catch(e => toast('Could not load: ' + e));
</script>
</body>
</html>
